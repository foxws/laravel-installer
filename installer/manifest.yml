# The installer for your app. Copy this folder into your app as "installer/"
# and build your installer image from ghcr.io/foxws/laravel-installer.
name: Example

# Shown in the header: the version this installs, and links that open in a
# new tab.
# version: '1.0'
# links:
#   - { label: Help, url: 'https://example.com/docs' }
#   - { label: Source, url: 'https://github.com/example/app' }

steps:
  - id: welcome
    file: welcome.md

  - id: requirements
    type: requirements
    file: requirements.md

  # Creates the Podman secrets the services use. Needs the app's folder
  # mounted at /workspace, like the services step.
  # - id: secrets
  #   type: secrets
  #   file: secrets.md
  #   presets: [production]
  #   values:
  #     POSTGRES_PASSWORD: DB_PASSWORD

  # Renders the app's presets into its folder, installs and starts them. Needs
  # "lpod installer IMAGE --workspace PATH".
  # - id: services
  #   type: services
  #   file: services.md
  #   presets: [production]

  - id: finish
    file: finish.md
